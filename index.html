<!DOCTYPE html>
<html>
<head>
    <title>Abejo Car Wash POS System</title>

    <style>
        body{
            font-family: Arial;
            margin:0;
            background-image: url(./picha\ kali\ -\ Copy.webp);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #loginScreen{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            z-index:9999;
            color:white;
        }

        .profile-wrapper{
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom:10px;
        }

        #profilePreview{
            width:110px;
            height:110px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid white;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,0.6);
        }

        .camera-icon{
            position:absolute;
            bottom:5px;
            right:5px;
            background:rgba(0,0,0,0.6);
            width:35px;
            height:35px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            color:white;
            font-size:18px;
        }

        #loginScreen input{
            padding:10px;
            border-radius:6px;
            border:none;
            width:220px;
            margin-top:10px;
        }

        #loginScreen button{
            margin-top:10px;
            padding:10px 20px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        #error{ color:red; margin-top:10px; }

        .overlay{ background: rgba(0,0,0,0.65); min-height: 100vh; }

        .header{
            background: rgba(0,119,182,0.9);
            color:white;
            padding:15px;
            text-align:center;
            position:relative;
        }

        .logout{
            position:absolute;
            right:45px;
            top:45px;
            background: rgba(0,119,182,0.9);
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
        }

        .changePass{
            position:absolute;
            right:160px;
            top:45px;
            background-color: rgba(205, 95, 55);
            color:black;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
        }

        .container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
        }

        .salesBox{
            background:white;
            color:black;
            padding:15px;
            border-radius:10px;
        }

        .form-group{
            display:flex;
            gap:10px;
        }

        .form-group input,
        .form-group select{
            flex:1;
            padding:10px;
            margin:8px 0;
        }

        .button-row{
            display:flex;
            gap:10px;
            margin-top:10px;
        }

        .button-row button{
            flex:1;
            padding:10px;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }

        .button-row button:first-child{ background:#28a745; }
        .button-row button:last-child{ background:#0077b6; }

        .sales{
            font-size:24px;
            color:green;
            font-weight:bold;
        }

        ul{ padding-left:20px; }

        .big-photo img{
            width:100%;
            height:260px;
            margin-top:14px;
            object-fit:cover;
            border-radius:12px;
        }

        .gallery-wrapper{
            overflow:hidden;
            width:100%;
            margin:20px;
        }

        .gallery{
            display:flex;
            gap:10px;
            width:max-content;
            animation: slideLeft 18s linear infinite;
        }

        .gallery img{
            width:180px;
            height:120px;
            object-fit:cover;
            border-radius:10px;
        }

        @keyframes slideLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @media(max-width:768px){
            .container{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="profile-wrapper">
        <img id="profilePreview" src="./profile.png">
        <div class="camera-icon">📷</div>
    </div>

    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="checkPassword()">Login</button>

    <div id="error"></div>
</div>

<!-- APP -->
<div class="overlay" id="app" style="display:none;">

<div class="header">
    <h1>ABEJO CAR WASH SYSTEM</h1>

    <button class="changePass" onclick="changePassword()">Change Password</button>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">
    <h2>Add Sale</h2>

    <div class="form-group">
        <input type="number" id="amount" placeholder="Enter Price (TZS)">
        <select id="service">
            <option>Basic Wash</option>
            <option>Full Wash</option>
            <option>Engine Wash</option>
        </select>
    </div>

    <div class="button-row">
        <button onclick="addSale()">Save Sale</button>
        <button onclick="sendWhatsApp()">Send Report</button>
    </div>

    <div class="big-photo">
        <img src="./abejo love.jpeg">
    </div>
</div>

<div class="salesBox">
    <h2>💰 Total Sales</h2>
    <p class="sales" id="total">TZS 0</p>

    <h3>Sales List</h3>
    <ul id="list"></ul>
</div>

</div>

<!-- SLIDER -->
<div class="gallery-wrapper">
    <div class="gallery">
        <img src="./abejo love.jpeg">
        <img src="./the boss angel.jpeg">
        <img src="./abejo 2.webp">
        <img src="./abejo 3.webp">
        <img src="./abejo in Ofice.jpeg">
        <img src="./picha kali - Copy.webp">
        <img src="./washing-car-using-high-pressure-washer-cleaning-vehicle-yard-washing-car-using-high-pressure-washer-cleaning-vehicle-yard-446042137.webp">
    </div>
</div>

</div>

<script>

let sales = JSON.parse(localStorage.getItem("abejo_sales")) || [];
let savedPassword = localStorage.getItem("abejo_password") || "1234";

/* LOGIN */
function checkPassword(){
    let pass = document.getElementById("password").value;

    if(pass === savedPassword){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
        updateUI();
    } else {
        document.getElementById("error").innerText = "Wrong password!";
    }
}

/* CHANGE PASSWORD */
function changePassword(){
    let oldPass = prompt("Enter current password:");
    if(oldPass !== savedPassword){
        alert("Wrong current password!");
        return;
    }

    let newPass = prompt("Enter new password:");
    if(!newPass){
        alert("Password not changed");
        return;
    }

    savedPassword = newPass;
    localStorage.setItem("abejo_password", newPass);

    alert("Password changed successfully!");
}

/* LOGOUT */
function logout(){
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
}

/* ADD SALE */
function addSale(){

    let amount = document.getElementById("amount").value;
    let service = document.getElementById("service").value;

    if(amount === "" || amount <= 0){
        alert("Enter valid price");
        return;
    }

    let now = new Date();

    let day = now.getDate().toString().padStart(2,'0');
    let month = (now.getMonth()+1).toString().padStart(2,'0');
    let year = now.getFullYear();

    sales.push({
        amount: parseInt(amount),
        service,
        time: now.toLocaleTimeString(),
        date: `${day}-${month}-${year}`
    });

    localStorage.setItem("abejo_sales", JSON.stringify(sales));
    document.getElementById("amount").value = "";

    updateUI();
}

/* UPDATE UI */
function updateUI(){

    let total = 0;
    let list = document.getElementById("list");
    list.innerHTML = "";

    sales.forEach(s => {
        total += s.amount;

        let li = document.createElement("li");
        li.innerHTML = `${s.service} - TZS ${s.amount} - ${s.time} |  ${s.date}`;
        list.appendChild(li);
    });

    document.getElementById("total").innerText = "TZS " + total;
}

/* WHATSAPP */
function sendWhatsApp(){

    let total = 0;
    let msg = "🚗 ABEJO CAR WASH REPORT\n\n";

    sales.forEach(s => {
        total += s.amount;
        msg += `${s.service} - TZS ${s.amount} - ${s.time} | ${s.date}\n`;
    });

    msg += "\nTOTAL: " + total;

    window.open("https://wa.me/255747189518?text=" + encodeURIComponent(msg));
}

</script>

</body>
</html>
