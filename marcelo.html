<!DOCTYPE html>
<html>
<head>
    <title>Abejo Car Wash POS System</title>

    <style>
        body{
            font-family: Arial;
            margin:0;
            background-image: url(./picha\ kali\ -\ Copy.webp);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 🔐 LOGIN SCREEN */
        #loginScreen{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            z-index:9999;
            color:white;
        }

        /* 👤 PROFILE CIRCLE WRAPPER */
        .profile-wrapper{
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom:10px;
        }

        #profilePreview{
            width:110px;
            height:110px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid white;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,0.6);
        }

        /* 📷 CAMERA ICON OVERLAY */
        .camera-icon{
            position:absolute;
            bottom:5px;
            right:5px;
            background:rgba(0,0,0,0.6);
            width:35px;
            height:35px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            color:white;
            font-size:18px;
        }

        #loginScreen input{
            padding:10px;
            border-radius:6px;
            border:none;
            width:220px;
            margin-top:10px;
        }

        #loginScreen button{
            margin-top:10px;
            padding:10px 20px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        #error{
            color:red;
            margin-top:10px;
        }

        .overlay{
            background: rgba(0,0,0,0.65);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header{
            background: rgba(0,119,182,0.9);
            color:white;
            padding:15px;
            text-align:center;
        }

        .container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .form-group{
            display:flex;
            gap:10px;
        }

        .form-group input,
        .form-group select{
            flex:1;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:6px;
        }

        .button-row{
            display:flex;
            gap:10px;
            margin-top:10px;
        }

        .button-row button{
            flex:1;
            padding:10px;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }

        .button-row button:first-child{
            background:#28a745;
        }

        .button-row button:last-child{
            background:#0077b6;
        }

        .sales{
            font-size:24px;
            color:green;
            font-weight:bold;
        }

        ul{
            padding-left:20px;
        }

        .big-photo img{
            width:100%;
            height:260px;
            margin-top:14px;
            object-fit:cover;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        /* 🚗 GALLERY */
        .gallery-wrapper{
            overflow:hidden;
            width:100%;
            margin:20px;
        }

        .gallery{
            display:flex;
            gap:10px;
            width:max-content;
            animation: slideLeft 18s linear infinite;
        }

        .gallery img{
            width:180px;
            height:120px;
            object-fit:cover;
            border-radius:10px;
            box-shadow:0 3px 8px rgba(0,0,0,0.3);
        }

        @keyframes slideLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 🔐 PASSWORD BOX */
        #passwordBox{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            justify-content:center;
            align-items:center;
            flex-direction:column;
            color:white;
            z-index:9999;
        }

        #passwordBox input{
            padding:10px;
            margin:5px;
            width:220px;
            border:none;
            border-radius:6px;
        }

        @media(max-width:768px){
            .container{
                grid-template-columns:1fr;
            }

            .gallery img{
                width:140px;
                height:100px;
            }
        }
    </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen">

    <div class="profile-wrapper">

        <img id="profilePreview" src="./profile.png">

        <div class="camera-icon" onclick="triggerUpload()">📷</div>

    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="loadProfile(event)" style="display:none;">

    <h2> ABEJO CAR WASH POS</h2>

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="checkPassword()">Login</button>

    <div id="error"></div>
</div>

<!-- 🔐 PASSWORD CHANGE -->
<div id="passwordBox">
    <h2>Change Password</h2>

    <input type="password" id="oldPass" placeholder="Current Password">
    <input type="password" id="newPass" placeholder="New Password">

    <button onclick="changePassword()" style="background:#28a745;color:white;">
        Save New Password
    </button>

    <button onclick="closePasswordBox()" style="background:red;color:white;">
        Close
    </button>

    <p id="pwdMsg"></p>
</div>

<!-- 🚗 APP -->
<div class="overlay" id="app" style="display:none;">

<div class="header">
    <h1> ABEJO CAR WASH POS SYSTEM</h1>

    <button onclick="logout()" style="
        float:right;
        margin-top:-40px;
        background:#ff9800;
        color:white;
        border:none;
        padding:10px 15px;
        border-radius:6px;
        cursor:pointer;
    ">
        Logout
    </button>
</div>

<div class="container">

    <!-- LEFT -->
    <div class="card">
        <h2>Add Sale</h2>

        <div class="form-group">
            <input type="number" id="amount" placeholder="Enter Price (TZS)">
            
            <select id="service">
                <option>Basic Wash</option>
                <option>Full Wash</option>
                <option>Engine Wash</option>
            </select>
        </div>

        <div class="button-row">
            <button onclick="addSale()"> Save Sale</button>
            <button onclick="sendWhatsApp()"> Send Report</button>
        </div>

        <button onclick="showPasswordBox()" style="
            margin-top:10px;
            width:100%;
            padding:10px;
            background:#ff9800;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        ">
            Change Password
        </button>

        <div class="big-photo">
            <img src="./abejo love.jpeg">
        </div>
    </div>

    <!-- RIGHT -->
    <div class="card">
        <h2>💰 Total Sales</h2>

        <p class="sales" id="total">TZS 0</p>

        <h3> Sales List</h3>
        <ul id="list"></ul>
    </div>

</div>

<!-- 🚗 GALLERY -->
<div class="gallery-wrapper">
    <div class="gallery">
        <img src="./abejo love.jpeg">
        <img src="./the boss angel.jpeg">
        <img src="./abejo 2.webp">
        <img src="./abejo 3.webp">
        <img src="./abejo in Ofice.jpeg">
        <img src="./picha kali - Copy.webp">
        <img src="./washing-car-using-high-pressure-washer-cleaning-vehicle-yard-washing-car-using-high-pressure-washer-cleaning-vehicle-yard-446042137.webp">
        <img src="./abejo love.jpeg">
        <img src="./abejo 2.webp">
        <img src="./abejo 3.webp">
    </div>
</div>

</div>

<script>

let sales = [];

/* PASSWORD */
function getPassword(){
    return localStorage.getItem("abejo_password") || "1234";
}

/* LOGIN */
function checkPassword(){
    let pass = document.getElementById("password").value;

    if(pass.trim() === getPassword()){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        document.getElementById("error").innerText = "Wrong password!";
    }
}

/* LOGOUT */
function logout(){
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("password").value = "";
}

/* PROFILE CLICK */
function triggerUpload(){
    document.getElementById("fileInput").click();
}

/* PROFILE UPLOAD */
function loadProfile(event){

    let reader = new FileReader();

    reader.onload = function(){
        let img = reader.result;

        document.getElementById("profilePreview").src = img;
        localStorage.setItem("abejo_profile", img);
    }

    reader.readAsDataURL(event.target.files[0]);
}

/* LOAD PROFILE ON START */
window.onload = function(){

    let savedImg = localStorage.getItem("abejo_profile");

    if(savedImg){
        document.getElementById("profilePreview").src = savedImg;
    }
}

/* ADD SALE */
function addSale(){

    let amount = document.getElementById("amount").value;
    let service = document.getElementById("service").value;

    if(amount === "" || amount <= 0){
        alert("Enter valid price");
        return;
    }

    let now = new Date();

    sales.push({
        amount: parseInt(amount),
        service: service,
        time: now.toLocaleTimeString(),
        date: now.toLocaleDateString("en-GB")
    });

    document.getElementById("amount").value = "";

    updateUI();
}

/* UPDATE UI */
function updateUI(){

    let total = 0;
    let list = document.getElementById("list");
    list.innerHTML = "";

    sales.forEach(s => {
        total += s.amount;
        let li = document.createElement("li");
        li.innerHTML = `${s.service} - TZS ${s.amount} - 🕒 ${s.time} - 📅 ${s.date}`;
        list.appendChild(li);
    });

    document.getElementById("total").innerText = "TZS " + total;
}

/* WHATSAPP */
function sendWhatsApp(){

    let total = 0;
    let msg = "🚗 ABEJO CAR WASH REPORT\n\n";

    sales.forEach(s => {
        total += s.amount;
        msg += `${s.service} - TZS ${s.amount} - ${s.time} - ${s.date}\n\n`;
    });

    msg += "TOTAL: TZS " + total;

    let phone = "255747189518";

    window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(msg));
}

/* PASSWORD BOX */
function showPasswordBox(){
    document.getElementById("passwordBox").style.display = "flex";
}

function closePasswordBox(){
    document.getElementById("passwordBox").style.display = "none";
}

function changePassword(){

    let oldPass = document.getElementById("oldPass").value;
    let newPass = document.getElementById("newPass").value;

    if(oldPass !== getPassword()){
        document.getElementById("pwdMsg").innerText = "Wrong current password";
        return;
    }

    localStorage.setItem("abejo_password", newPass);

    document.getElementById("pwdMsg").innerText = "Password changed successfully!";
}

</script>

</body>
</html>
